<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - BAKOR Medical</title>
    <meta name="description" content="Report for BAKOR Medical Patient History Site">
    <meta name="author" content="Angel Nelson Eteng">
    <meta property="og:title" content="Report - BAKOR Medical">
    <meta property="og:description" content="Report for BAKOR Medical Patient History Site">
    <meta property="og:image" content="https://etimg.etb2bimg.com/photo/94525801.cms">
    <meta property="og:url" content="https://bakor-medical.netlify.app/report">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="app.js" defer></script>
</head>

<body>

    <div id="app-container" class="app-layout">
        <aside class="sidebar">
            <!-- Inside <aside class="sidebar"> -->
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fa-solid fa-stethoscope"></i></div>
                <div class="brand-text">
                    <h3>Bakor Medical</h3>
                    <span>Patient History System</span>
                </div>
                <!-- TOGGLE BUTTON -->
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="patient.html" class="nav-item"><i class="fa-solid fa-users"></i> Patients</a>
                <a href="medical.html" class="nav-item"><i class="fa-solid fa-file-medical"></i> Medical Records</a>
                <a href="report.html" class="nav-item active"><i class="fa-solid fa-print"></i> Reports</a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Inside <header class="top-header"> -->
            <header class="top-header">
                <div class="header-left">
                    <!-- HAMBURGER MENU BUTTON -->
                    <button id="toggle-sidebar-btn" class="hamburger-btn">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="breadcrumb">Reports</div>
                </div>
            
                <div class="user-profile">
                    <div id="avatar-circle" class="avatar">OA</div>
                    <div class="user-info">
                        <span id="user-display-name" class="user-name">Angel Nelson</span>
                        <span id="user-role-badge" class="user-role">Admin</span>
                    </div>
                </div>
            </header>

            <main class="content-body">
                <div class="page-header">
                    <div>
                        <h2>Reports</h2>
                        <p>Generate printable patient histories and medical summaries.</p>
                    </div>
                </div>

                <div class="card p-24">
                    <div class="form-group" style="max-width: 400px;">
                        <label for="report-patient-select">Select Patient for History Report</label>
                        <select id="report-patient-select"></select>
                    </div>
                    <button class="btn btn-teal" id="generate-report-btn">
                        <i class="fa-solid fa-print"></i> Generate & Print Report
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- PRINTABLE AREA -->
    <div id="printable-report" class="printable-area hidden">
        <div class="report-header">
            <h2>BAKOR MEDICAL CENTER</h2>
            <p>Patient Medical History Statement</p>
            <hr />
        </div>
        <div id="report-content"></div>
    </div>
</body>

</html>
