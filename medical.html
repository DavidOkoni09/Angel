<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Report - BAKOR Medical</title>
    <meta name="description" content="Medicals for BAKOR Medical Patient History Site">
    <meta name="author" content="Angel Nelson Eteng">
    <meta property="og:title" content="Medicals - BAKOR Medical">
    <meta property="og:description" content="Medicals for BAKOR Medical Patient History Site">
    <meta property="og:image" content="https://etimg.etb2bimg.com/photo/94525801.cms">
    <meta property="og:url" content="https://bakor-medical.netlify.app/medical">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="app.js" defer></script>
</head>

<body>

    <div id="app-container" class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fa-solid fa-stethoscope"></i></div>
                <div class="brand-text">
                    <h3>Bakor Medical</h3>
                    <span>Patient History System</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="patient.html" class="nav-item"><i class="fa-solid fa-users"></i> Patients</a>
                <a href="medical.html" class="nav-item active"><i class="fa-solid fa-file-medical"></i> Medical
                    Records</a>
                <a href="report.html" class="nav-item"><i class="fa-solid fa-print"></i> Reports</a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Inside <header class="top-header"> -->
            <header class="top-header">
                <div class="header-left">
                    <!-- HAMBURGER MENU BUTTON -->
                    <button id="toggle-sidebar-btn" class="hamburger-btn">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="breadcrumb">Medical Records</div>
                </div>
            
                <div class="user-profile">
                    <div id="avatar-circle" class="avatar">AN</div>
                    <div class="user-info">
                        <span id="user-display-name" class="user-name">Angel Nelson</span>
                        <span id="user-role-badge" class="user-role">Admin</span>
                    </div>
                </div>
            </header>

            <main class="content-body">
                <div class="page-header">
                    <div>
                        <h2>Medical Records</h2>
                        <p>View and add diagnostic records and treatment histories.</p>
                    </div>
                    <button class="btn btn-teal" id="open-record-modal-btn">
                        <i class="fa-solid fa-plus"></i> Add Medical Record
                    </button>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="record-search" placeholder="Filter by Patient ID or Diagnosis..." />
                </div>

                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>RECORD ID</th>
                                <th>PATIENT ID</th>
                                <th>VISIT DATE</th>
                                <th>DIAGNOSIS</th>
                                <th>TREATMENT</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="records-list"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL: ADD MEDICAL RECORD -->
    <div id="record-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Medical Record</h3>
                <span class="close-modal">&times;</span>
            </div>
            <form id="record-form">
                <div class="form-group">
                    <label for="record_patient_id">Select Patient *</label>
                    <select id="record_patient_id" required></select>
                </div>
                <div class="form-group">
                    <label for="visit_date">Visit Date *</label>
                    <input type="date" id="visit_date" required />
                </div>
                <div class="form-group">
                    <label for="diagnosis">Diagnosis *</label>
                    <input type="text" id="diagnosis" placeholder="e.g. Malaria" required />
                </div>
                <div class="form-group">
                    <label for="treatment">Treatment / Prescription *</label>
                    <textarea id="treatment" rows="3" placeholder="e.g. Artemether/Lumefantrine" required></textarea>
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="2" placeholder="Optional notes"></textarea>
                </div>
                <button type="submit" class="btn btn-teal btn-full">Save Medical Record</button>
            </form>
        </div>
    </div>
</body>

</html>
