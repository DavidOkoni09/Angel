<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patients - BAKOR Medical</title>
    <meta name="description" content="Patients List for BAKOR Medical Patient History Site">
    <meta name="author" content="Angel Nelson Eteng">
    <meta property="og:title" content="Patients - BAKOR Medical">
    <meta property="og:description" content="Patients List for BAKOR Medical Patient History Site">
    <meta property="og:image" content="https://etimg.etb2bimg.com/photo/94525801.cms">
    <meta property="og:url" content="https://bakor-medical.netlify.app/patient">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="app.js" defer></script>
</head>

<body>

    <div id="app-container" class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fa-solid fa-stethoscope"></i></div>
                <div class="brand-text">
                    <h3>Bakor Medical</h3>
                    <span>Patient History System</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i> Dashboard</a>
                <a href="patient.html" class="nav-item active"><i class="fa-solid fa-users"></i> Patients</a>
                <a href="medical.html" class="nav-item"><i class="fa-solid fa-file-medical"></i> Medical Records</a>
                <a href="report.html" class="nav-item"><i class="fa-solid fa-print"></i> Reports</a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Inside <header class="top-header"> -->
            <header class="top-header">
                <div class="header-left">
                    <!-- HAMBURGER MENU BUTTON -->
                    <button id="toggle-sidebar-btn" class="hamburger-btn">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="breadcrumb">Patients</div>
                </div>
            
                <div class="user-profile">
                    <div id="avatar-circle" class="avatar">AN</div>
                    <div class="user-info">
                        <span id="user-display-name" class="user-name">Angel Nelson</span>
                        <span id="user-role-badge" class="user-role">Admin</span>
                    </div>
                </div>
            </header>

            <main class="content-body">
                <div class="page-header">
                    <div>
                        <h2>Patients</h2>
                        <p>Register, search and manage patient profiles.</p>
                    </div>
                    <button class="btn btn-teal" id="open-patient-modal-btn">
                        <i class="fa-solid fa-plus"></i> Register Patient
                    </button>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="patient-search" placeholder="Search by Patient ID, name or phone..." />
                </div>

                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>PATIENT ID</th>
                                <th>NAME</th>
                                <th>GENDER</th>
                                <th>DOB</th>
                                <th>PHONE</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="patients-list"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL: REGISTER PATIENT -->
    <div id="patient-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Register New Patient</h3>
                <span class="close-modal">&times;</span>
            </div>
            <form id="patient-form">
                <div class="form-group">
                    <label for="full_name">Full Name *</label>
                    <input type="text" id="full_name" required placeholder="e.g. John Doe" />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="08012345678" />
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Calabar, Cross River" />
                </div>
                <button type="submit" class="btn btn-teal btn-full">Save Patient Profile</button>
            </form>
        </div>
    </div>
</body>

</html>
